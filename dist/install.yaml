    control-plane: controller-manager
  name: unifi-network-operator-controller-manager-metrics-service
  namespace: unifi-network-operator-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: unifi-network-operator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: unifi-network-operator
    control-plane: controller-manager
  name: unifi-network-operator-controller-manager
  namespace: unifi-network-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: unifi-network-operator
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        env:
        - name: UNIFI_URL
          valueFrom:
            secretKeyRef:
              key: UNIFI_URL
              name: unifi-configuration
        - name: UNIFI_SITE
          valueFrom:
            secretKeyRef:
              key: UNIFI_SITE
              name: unifi-configuration
        - name: UNIFI_USER
          valueFrom:
            secretKeyRef:
              key: UNIFI_USERNAME
              name: unifi-configuration
        - name: UNIFI_PASSWORD
          valueFrom:
            secretKeyRef:
              key: UNIFI_PASSWORD
              name: unifi-configuration
        image: gitea.engen.priv.no/klauvsteinen/unifi-network-operator-controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: unifi-network-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
